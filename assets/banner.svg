<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="chart-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.35"/>
    </linearGradient>

    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 46px; fill: url(#title-grad); }
    .subtitle { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 400; font-size: 20px; fill: #94a3b8; }
    .badge-text { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 13px; fill: #38bdf8; }
    
    @keyframes pulse {
      0% { r: 6px; opacity: 0.8; }
      50% { r: 10px; opacity: 0.3; }
      100% { r: 6px; opacity: 0.8; }
    }
    @keyframes wave {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }
    .glowing-dot { animation: pulse 3s infinite ease-in-out; fill: #34d399; }
    .animated-wave { animation: wave 6s infinite ease-in-out; }
  </style>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="16" fill="url(#glow)"/>

  <!-- Background Animated Chart / Dynamic Aspect (Behind text) -->
  <g opacity="0.45" class="animated-wave">
    <path d="M 50 260 Q 200 240 350 210 T 650 170 T 950 110 T 1150 70 L 1150 280 L 50 280 Z" fill="url(#chart-grad)"/>
    <path d="M 50 260 Q 200 240 350 210 T 650 170 T 950 110 T 1150 70" fill="none" stroke="url(#line-grad)" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Data Points -->
    <circle cx="350" cy="210" r="6" fill="#34d399"/>
    <circle cx="650" cy="170" r="6" fill="#60a5fa"/>
    <circle cx="950" cy="110" r="6" fill="#a78bfa"/>
    <circle cx="1150" cy="70" r="8" class="glowing-dot"/>
  </g>

  <!-- Grid Lines (Subtle) -->
  <g opacity="0.1" stroke="#ffffff" stroke-width="1" stroke-dasharray="4 4">
    <line x1="50" y1="80" x2="1150" y2="80"/>
    <line x1="50" y1="140" x2="1150" y2="140"/>
    <line x1="50" y1="200" x2="1150" y2="200"/>
    <line x1="50" y1="260" x2="1150" y2="260"/>
  </g>

  <!-- Foreground Content (Guaranteed crisp and unobstructed visibility) -->
  <!-- Tag Pill -->
  <rect x="60" y="45" width="220" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
  <text x="170" y="66" text-anchor="middle" class="badge-text">⚡ CURATED ECOSYSTEM</text>

  <!-- Main Title -->
  <text x="60" y="135" class="title">Awesome Cash Flow Management 💰</text>

  <!-- Subtitle -->
  <text x="60" y="180" class="subtitle">Top SaaS Platforms, Open-Source Tools &amp; Financial Forecasting Engines</text>
  <text x="60" y="210" class="subtitle" opacity="0.75">Curated for CFOs, Finance Teams, Founders &amp; Developers</text>

  <!-- Stats / Pill Cards at Bottom -->
  <g transform="translate(60, 245)">
    <rect width="180" height="38" rx="8" fill="#0f172a" fill-opacity="0.7" stroke="#334155"/>
    <text x="90" y="24" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="600">📊 SaaS Platforms</text>
  </g>
  <g transform="translate(255, 245)">
    <rect width="180" height="38" rx="8" fill="#0f172a" fill-opacity="0.7" stroke="#334155"/>
    <text x="90" y="24" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="600">⭐ Open-Source Tools</text>
  </g>
  <g transform="translate(450, 245)">
    <rect width="210" height="38" rx="8" fill="#0f172a" fill-opacity="0.7" stroke="#334155"/>
    <text x="105" y="24" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="600">🚀 AI &amp; ML Forecasters</text>
  </g>
</svg>
